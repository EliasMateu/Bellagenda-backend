# PostgreSQL apenas para desenvolvimento local. Porta publicada somente em 127.0.0.1.
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
