# Serve apenas /static/admin/ (estaticos do Django admin). Qualquer outro caminho: 404.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /static/admin/ {
        alias /srv/static/admin/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
